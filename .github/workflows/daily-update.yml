# 매일 밤 자동으로 순위를 갱신하는 설정 파일 (밤 11시 13분, 못 돌면 11시 43분)
#
# 하는 일
#   1) 이 저장소를 깃허브 서버에 내려받는다
#   2) 갱신.py 를 돌린다 (등록요청 시트 읽기 + cwal.gg 수집 + index.html 만들기)
#   3) 바뀐 index.html · 명단.json · 계정.json · notfound.json 을 이 저장소에 되돌려 저장한다
#      → 저장되는 순간 홈페이지에 반영된다
#
# 내 컴퓨터가 꺼져 있어도 깃허브가 대신 돌려준다.

name: 매일 밤 순위 갱신

on:
  schedule:
    # 세계표준시 기준이라 9시간을 빼서 적는다.
    #
    # 두 번 잡아 둔 이유:
    # 깃허브는 예약 시각에 사람이 몰리면 그 판을 아예 건너뛴다.
    # 실제로 9/2~9/4 사흘 내리 건너뛰어서 순위가 멈춰 있었다.
    # 그래서 '몰리는 시각(정각·30분·55분)' 을 피하고, 30분 뒤에
    # 한 번 더 잡아 뒀다. 앞판이 돌았으면 뒷판은 "바뀐 게 없습니다"
    # 하고 그냥 끝나므로 두 번 돌아도 문제 없다.
    - cron: '13 14 * * *'      # 한국시간 23:13
    - cron: '43 14 * * *'      # 한국시간 23:43  (앞판이 건너뛰었을 때 대비)
  workflow_dispatch:        # 깃허브 화면의 버튼으로 아무 때나 돌릴 수도 있다

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 결과를 이 저장소에 되돌려 저장할 권한

    steps:
      - name: 갱신기 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 갱신기 돌리기
        env:
          KS_PUB: index.html    # 공개용 페이지를 저장소 맨 위에 바로 만든다
        run: python 갱신.py

      - name: 홈페이지에 반영
        run: |
          git config user.name  "ks-ladder-bot"
          git config user.email "ks-ladder-bot@users.noreply.github.com"
          git add index.html 명단.json 계정.json notfound.json
          git diff --cached --quiet && echo "바뀐 게 없습니다" && exit 0
          git commit -m "순위 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"

          # 순위 모으는 데 10분 넘게 걸린다. 그 사이에 다른 변경이 올라와 있으면
          # 그냥 올리기가 거부되고, 애써 모은 결과가 통째로 날아간다.
          # 그래서 거부당하면 남의 것을 먼저 받아 놓고 다시 올린다. (세 번까지)
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "그 사이 누가 먼저 올렸습니다. 받아서 다시 시도합니다 ($i/3)"
            git pull --rebase origin main
          done
          git push
