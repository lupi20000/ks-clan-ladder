# 예약이 진짜로 도는지 알아보는 시험용 파일 (임시)
#
# 밤 갱신이 9/2~9/6 닷새 내리 건너뛰었다. 설정에는 문제가 없어 보이는데
# 예약만 안 먹는 상황이라, "깃허브 예약 자체가 이 저장소에서 도는가" 를
# 따로 확인하려고 만들었다.
#
# 하는 일은 한 줄 찍는 것뿐이라 순위에는 아무 영향이 없다.
# 결론이 나면 이 파일은 지운다.

name: 예약 시험 (임시)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "예약이 돌았습니다 - $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
