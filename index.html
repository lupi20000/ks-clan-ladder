*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto;padding:32px 20px 64px;display:flex;flex-direction:column;gap:20px}

/* ── 머리말 ── */
.head{display:flex;flex-direction:column;gap:6px}
.eyebrow{
  font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
}
h1{
  font-family:"Chakra Petch","Noto Sans KR",sans-serif;
  font-weight:700;font-size:clamp(30px,5vw,44px);line-height:1.1;
  margin:0;text-wrap:balance;letter-spacing:-.01em;
}
.sub{color:var(--ink-3);font-size:13px;margin:0;font-variant-numeric:tabular-nums}

/* ── 조작 막대 ── */
.bar{
  position:sticky;top:0;z-index:5;
  background:var(--panel);border:1px solid var(--line-soft);border-radius:4px;
  padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  box-shadow:var(--shadow);
}
input,select,button{font-family:inherit;font-size:14px;color:var(--ink)}
input,select{
  background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:8px 10px;
}
input[type=search]{flex:1 1 220px;min-width:0}
input::placeholder{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{margin-left:auto;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── 표 ── */
.tablewrap{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:4px;
  overflow-x:auto;box-shadow:var(--shadow);
}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-soft)}
thead th{
  position:sticky;top:0;background:var(--panel-2);
  font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  border-bottom:1px solid var(--line);white-space:nowrap;
}
thead th.s{cursor:pointer}
thead th.s:hover{color:var(--ink)}
thead th.on{color:var(--accent)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--accent-soft)}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right}

.rk{
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  color:var(--ink-3);width:52px;text-align:right;font-size:13px;
}
tr.top .rk{color:var(--accent);font-weight:600;font-size:15px}

.toon{display:flex;flex-direction:column;gap:1px}
.toon a{
  font-family:"Chakra Petch","Noto Sans KR",sans-serif;font-weight:600;font-size:15px;
  color:var(--ink);text-decoration:none;border-bottom:1px solid transparent;
}
.toon a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.toon .bt{font-size:12px;color:var(--ink-3)}
.toon .mobi{display:none}

.tier{
  display:inline-block;font-family:"Chakra Petch",sans-serif;font-weight:600;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 8px;border-radius:2px;color:#fff;white-space:nowrap;
}
.dash{color:var(--ink-3)}
.race{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:14px}

.mmr{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.standing{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.wl{display:flex;flex-direction:column;gap:3px;min-width:98px}
.wl .t{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.wl .track{height:4px;background:var(--line-soft);border-radius:2px;overflow:hidden}
.wl .fill{height:100%;background:var(--good)}
.wl .fill.lo{background:var(--bad)}
.empty{padding:40px 16px;text-align:center;color:var(--ink-3)}

/* ── 아이디 추가 ── */
.add{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:4px;
  padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);
}
.add h2{
  font-family:"Chakra Petch","Noto Sans KR",sans-serif;font-weight:600;
  font-size:15px;margin:0;letter-spacing:.01em;
}
.addrow{display:flex;flex-wrap:wrap;gap:8px}
.addrow input{flex:1 1 180px;min-width:0}
button{
  background:var(--accent);border:1px solid var(--accent);color:#fff;
  border-radius:3px;padding:8px 16px;cursor:pointer;font-weight:500;
}
button:hover{filter:brightness(1.08)}
button.ghost{background:transparent;border-color:var(--line);color:var(--ink-2)}
button.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
.pending{display:flex;flex-direction:column;gap:6px}
.pend{
  display:flex;align-items:center;gap:10px;padding:7px 10px;
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:3px;
  font-family:"IBM Plex Mono",monospace;font-size:13px;
}
.pend .arrow{color:var(--ink-3)}
.pend .x{
  margin-left:auto;background:none;border:none;color:var(--ink-3);
  cursor:pointer;font-size:16px;line-height:1;padding:0 4px;
}
.pend .x:hover{color:var(--bad);filter:none}
.addfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:13px;color:var(--ink-3);margin:0}
.toast{font-size:13px;color:var(--good)}
footer{color:var(--ink-3);font-size:12px;text-align:center}

/* ── 휴대폰 ── */
@media (max-width:640px){
  .wrap{padding:20px 12px 44px;gap:14px}
  table{min-width:0}
  th,td{padding:9px 8px}
  .col-race,.col-wl{display:none}
  .toon{display:block}
  .toon .bt,.toon .mobi{display:inline;font-size:12px;color:var(--ink-3)}
  .toon .bt::before{content:" · "}
  .toon a{font-size:14px}
  .standing{display:none}
  .rk{width:34px;padding-right:4px}
  .mmr{font-size:15px}
  .tier{font-size:10px;padding:2px 6px}
  .bar{padding:10px}
}
</style>

<script>
(function(){
  var D = window.KS_DATA, R = D.rows;
  var TIERS = ["Black","Gold","Yellow","Red","Violet","Blue","Sky","White"];
  var RACE_KO = {T:"테란", P:"프로토스", Z:"저그"};

  // 순위는 MMR 순서로 한 번만 매겨두고, 정렬을 바꿔도 그대로 쓴다
  R.slice().sort(function(a,b){return b.rating-a.rating;})
   .forEach(function(r,i){ r._rank = i+1; });
  R.forEach(function(r){
    var g = r.wins + r.losses;
    r._wr = g ? r.wins/g : 0;
    r._games = g;
    r.winrate = r._wr;
    r._hay = ((r.id||"") + " " + r.toon + " " + (r.battleTag||"")).toLowerCase();
  });

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }
  function tierVar(t){ return TIERS.indexOf(t)>=0 ? "var(--t-"+t+")" : "var(--t-none)"; }

  document.getElementById("m-updated").textContent = D.updated + " 갱신";

  var sel = document.getElementById("tier");
  sel.innerHTML = '<option value="">티어 전체</option>' + TIERS.map(function(t){
    return '<option value="'+t+'">'+t+'</option>';
  }).join("");

  var sortKey = "rating", sortDir = -1;

  function draw(){
    var q    = document.getElementById("q").value.trim().toLowerCase();
    var tier = sel.value;
    var race = document.getElementById("race").value;

    var list = R.filter(function(r){
      if (q && r._hay.indexOf(q) < 0) return false;
      if (tier && r.tier !== tier) return false;
      if (race && r.cwalRace !== race) return false;
      return true;
    });

    list.sort(function(a,b){
      var x = a[sortKey], y = b[sortKey];
      if (typeof x === "string" || typeof y === "string"){
        x = String(x||"").toLowerCase(); y = String(y||"").toLowerCase();
        return x < y ? sortDir : x > y ? -sortDir : 0;
      }
      return ((x||0) - (y||0)) * sortDir;
    });

    document.getElementById("count").textContent = list.length + " / " + R.length + " 계정";

    if (!list.length){
      document.getElementById("tb").innerHTML =
        '<tr><td colspan="6" class="empty">조건에 맞는 계정이 없습니다.</td></tr>';
      return;
    }

    document.getElementById("tb").innerHTML = list.map(function(r){
      var url = "https://cwal.gg/profile/" + r.gateway + "/" + encodeURIComponent(r.toon);
      var wr  = Math.round(r._wr * 100);

      // 휴대폰에서는 종족·전적 열이 숨으니 계정 아랫줄에 같이 적어준다
      var mobi = (r.battleTag ? " · " : "")
               + (RACE_KO[r.cwalRace] || r.cwalRace || "")
               + (r._games ? " " + r.wins + "승 " + r.losses + "패" : "");

      return '<tr' + (r._rank <= 3 ? ' class="top"' : '') + '>'
        + '<td class="rk">' + r._rank + '</td>'
        + '<td><span class="toon"><a href="' + url + '" target="_blank" rel="noopener">'
          + esc(r.toon) + '</a>'
          + (r.battleTag ? '<span class="bt">' + esc(r.battleTag) + '</span>' : '')
          + '<span class="mobi">' + esc(mobi) + '</span>'
          + '</span></td>'
        + '<td>' + (r.tier
            ? '<span class="tier" style="background:' + tierVar(r.tier) + '">' + esc(r.tier) + '</span>'
            : '<span class="dash">-</span>') + '</td>'
        + '<td class="col-race"><span class="race" style="color:var(--r-' + esc(r.cwalRace || "T") + ')">'
          + esc(RACE_KO[r.cwalRace] || r.cwalRace || "-") + '</span></td>'
        + '<td class="num"><div class="mmr">' + r.rating.toLocaleString() + '</div>'
          + (r.standing ? '<div class="standing">전체 ' + r.standing.toLocaleString() + '위</div>' : '')
          + '</td>'
        + '<td class="col-wl"><div class="wl"><span class="t">' + r.wins + '승 ' + r.losses + '패'
          + (r._games ? '  ' + wr + '%' : '') + '</span>'
          + '<span class="track"><span class="fill' + (wr < 50 ? ' lo' : '') + '" style="width:'
          + (r._games ? wr : 0) + '%"></span></span></div></td>'
        + '</tr>';
    }).join("");
  }

  ["q","race"].forEach(function(id){
    document.getElementById(id).addEventListener("input", draw);
  });
  sel.addEventListener("input", draw);

  Array.prototype.forEach.call(document.querySelectorAll("th.s"), function(th){
    th.addEventListener("click", function(){
      var k = th.dataset.k;
      if (sortKey === k) sortDir = -sortDir;
      else { sortKey = k; sortDir = (k === "toon" || k === "tier") ? 1 : -1; }
      Array.prototype.forEach.call(document.querySelectorAll("th.s"), function(o){
        o.classList.toggle("on", o === th);
      });
      draw();
    });
  });

  draw();

  // ── 래더 아이디 추가 (이 브라우저에만 저장됨) ──
  var KEY = "ks-ladder-ids", pend = [];
  try { pend = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e) { pend = []; }

  var listEl = document.getElementById("a-list");
  var toastEl = document.getElementById("a-toast");
  var timer;

  function say(msg){
    toastEl.textContent = msg;
    clearTimeout(timer);
    timer = setTimeout(function(){ toastEl.textContent = ""; }, 2400);
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(pend)); } catch(e) {}
  }
  function drawPend(){
    listEl.innerHTML = pend.map(function(p, i){
      return '<div class="pend"><span>' + esc(p.id) + '</span>'
           + '<span class="arrow">&rarr;</span><span>' + esc(p.toon) + '</span>'
           + '<button class="x" data-i="' + i + '" title="지우기">&times;</button></div>';
    }).join("");
  }
  drawPend();

  document.getElementById("a-btn").addEventListener("click", function(){
    var id = document.getElementById("a-id").value.trim();
    var toon = document.getElementById("a-toon").value.trim();
    if (!id || !toon){ say("두 칸을 모두 채워주세요."); return; }
    pend.push({id:id, toon:toon});
    save(); drawPend();
    document.getElementById("a-id").value = "";
    document.getElementById("a-toon").value = "";
    document.getElementById("a-id").focus();
    say("추가했습니다.");
  });

  listEl.addEventListener("click", function(e){
    var b = e.target.closest("button.x");
    if (!b) return;
    pend.splice(+b.dataset.i, 1);
    save(); drawPend();
  });

  document.getElementById("a-copy").addEventListener("click", function(){
    if (!pend.length){ say("추가한 게 없습니다."); return; }
    var text = pend.map(function(p){ return p.id + "\t" + p.toon; }).join("\n");
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); say("복사했습니다. 붙여넣어 전달해 주세요."); }
    catch(err) { say("복사가 안 되면 직접 긁어서 복사해 주세요."); }
    document.body.removeChild(ta);
  });

  document.getElementById("a-clear").addEventListener("click", function(){
    pend = []; save(); drawPend(); say("비웠습니다.");
  });
})();
</script>
